name: ShiftSync CI

on:
  push:
    branches: ["main", "agent/**"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  project-validation:
    name: Project validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate architecture, tests, and documentation
        run: bash scripts/validate-project.sh

  android:
    name: Android build and JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug testDebugUnitTest testReleaseUnitTest assembleDebugAndroidTest
      - name: Report exact JVM counts
        if: always()
        run: python3 scripts/summarize-test-results.py app/build/test-results/testDebugUnitTest app/build/test-results/testReleaseUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/

  instrumentation:
    name: Android device instrumentation (API 35)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable runner KVM access
        run: |
          test -e /dev/kvm || { echo 'KVM unavailable; instrumentation not verified'; exit 1; }
          sudo chmod a+rw /dev/kvm
      - name: Execute instrumentation on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-device-tests.sh
      - name: Preserve device results and walkthrough evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-evidence
          path: |
            app/build/device-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
