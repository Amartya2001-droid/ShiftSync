name: ShiftSync CI

on:
  push:
    branches: ["main", "agent/**"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  project-validation:
    name: Project validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate architecture, tests, and documentation
        run: bash scripts/validate-project.sh

  android:
    name: Android build and JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug testDebugUnitTest assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: app/build/reports/tests/
